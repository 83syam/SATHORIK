<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050507">

  <title>SATHORIK | Retail Management</title>

  <meta name="description"
    content="SATHORIK - Sistem manajemen warung eceran, grosir dan sembako.">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <div class="brand">
      <div class="logo">S</div>
      <div class="brand-name">SATHORIK</div>
      <div class="brand-caption">
        SMART RETAIL MANAGEMENT
      </div>
    </div>

    <div class="trial-badge">
      DEMO 7 HARI
    </div>
  </header>

  <main class="container">

    <section class="welcome">
      <p class="gold-text">WELCOME TO</p>

      <h1>SATHORIK</h1>

      <p>
        Sistem Digital Pengelolaan Warung
        Eceran, Grosir dan Sembako.
      </p>
    </section>

    <section class="login-section">

      <h2>Pilih Akses Anda</h2>

      <div class="login-grid">

        <button class="login-card"
          type="button"
          data-role="creator">
          <span>♛</span>
          <strong>CREATOR</strong>
          <small>Pemilik Aplikasi</small>
        </button>

        <button class="login-card"
          type="button"
          data-role="merchant">
          <span>▣</span>
          <strong>PEDAGANG</strong>
          <small>Pengelola Warung</small>
        </button>

        <button class="login-card"
          type="button"
          data-role="customer">
          <span>🛍</span>
          <strong>PEMBELI</strong>
          <small>Konsumen Warung</small>
        </button>

      </div>

      <p id="status" class="status">
        Silakan pilih akses untuk memulai.
      </p>

    </section>

  </main>

  <footer>
    <p>© 2026 SATHORIK</p>
    <small>SMART RETAIL & WHOLESALE SYSTEM</small>
  </footer>

  <script src="script.js"></script>

</body>
</html>
